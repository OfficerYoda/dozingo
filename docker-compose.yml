services:
  postgres:
    image: postgres:16-alpine
    container_name: dozingo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dozingo-pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900" # S3 API Port
      - "127.0.0.1:3901:3901" # RPC Port
      - "127.0.0.1:3902:3902" # Web Port
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/meta
      - garage_data:/data
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET}
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Idempotent: safe to run on every `docker compose up`.
  garage-init:
    image: dxflrs/garage:v2.3.0
    container_name: garage-init
    depends_on:
      garage:
        condition: service_healthy
    network_mode: "service:garage"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/meta
    restart: "no"
    entrypoint: ["/garage"]
    command: ["bucket", "website", "--allow", "profile-pictures"]

volumes:
  dozingo-pgdata:
  garage_meta:
  garage_data:
