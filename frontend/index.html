<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dozingo</title>

    <!-- Primary meta -->
    <meta name="description" content="Dozingo – das Bingo-Spiel für Uni-Vorlesungen. Erstelle Boards, spiele mit anderen und gewinne Bingo!">
    <meta name="author" content="Dozingo Team">
    <meta name="theme-color" content="#4f46e5">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dozingo">
    <meta property="og:description" content="Das Bingo-Spiel für Uni-Vorlesungen. Boards erstellen, teilen und gewinnen.">

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dozingo">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
  </head>
  <body>
    <!-- SVG color correction filters for visual impairments -->
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
      <defs>
        <!-- Red-Green (Deuteranopia) correction:
             R and G channels are merged so both carry the R-G difference.
             B gets (G - R) encoded so the distinction becomes visible via blue. -->
        <filter id="filter-redgreen">
          <feColorMatrix type="matrix" values="
            0.56  0.44  0     0 0
            0.44  0.56  0     0 0
           -0.4   0.4   1     0 0
            0     0     0     1 0"/>
        </filter>
        <!-- Blue-Yellow (Tritanopia) correction:
             Blue receptor missing — yellow (R+G mix) and blue are indistinguishable.
             G gets (B - G) encoded so the distinction becomes visible via green. -->
        <filter id="filter-blueyellow">
          <feColorMatrix type="matrix" values="
            1     0     0     0 0
            0     0.56  0.44  0 0
            0     0.44  0.56  0 0
            0     0     0     1 0"/>
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
