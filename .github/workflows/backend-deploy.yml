name: backend build & deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/backend.yml

  build-and-push:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/officeryoda/dozingo-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The remote user's login shell may be fish, which does not
          # support POSIX heredocs / VAR=$(...) syntax. Hand the whole
          # script off to bash via `bash -c '...'` so the body is parsed
          # by bash regardless of the login shell.
          script: |
            bash -c '
            set -euo pipefail
            cd /opt/services/dozingo

            # Compose service / container name. Change this in one place
            # if the service is ever renamed in docker-compose.yml.
            SERVICE=dozingo-backend

            docker compose pull

            # Apply DB migrations using the migrate CLI baked into the
            # backend image. Runs as a one-shot container, exits 0 on
            # success or "no change". DATABASE_URL is loaded by compose
            # from the service env_file. We invoke /bin/sh -c inside the
            # container so $DATABASE_URL is expanded there, using the
            # container env, not the host env.
            echo "Running database migrations..."
            docker compose run --rm --entrypoint /bin/sh "$SERVICE" -c \
              "migrate -path /app/migrations -database \"\$DATABASE_URL\" up"

            docker compose up -d --remove-orphans

            echo "Waiting for $SERVICE to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" "$SERVICE" 2>/dev/null || echo "missing")
              echo "  attempt $i/12 - status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Healthy"
                exit 0
              fi
              sleep 5
            done

            echo "Container did not become healthy in time"
            docker compose logs --tail=100 "$SERVICE" || true
            exit 1
            '
