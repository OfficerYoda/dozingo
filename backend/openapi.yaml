info:
  title: Dozingo API
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/auth/2fa:
    delete:
      description: Remove 2FA from the account. Requires the current password and either a TOTP code or a recovery code.
      operationId: disable-2fa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFADestructiveInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Disable 2FA
      tags:
        - Auth
  /api/auth/2fa/confirm:
    post:
      description: Confirms that the user has the correct secret to generate the correct codes.
      operationId: confirm-2fa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFACodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFAConfirmOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 2FA Confirmation
      tags:
        - Auth
  /api/auth/2fa/regenerate-codes:
    post:
      description: Invalidate all existing recovery codes and issue a fresh set. Requires the current password and either a TOTP code or a recovery code.
      operationId: regenerate-2fa-codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFADestructiveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFAConfirmOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate 2FA Recovery Codes
      tags:
        - Auth
  /api/auth/2fa/setup:
    post:
      description: The first step to initialize 2FA for the current account.
      operationId: setup-2fa
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFASetupOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 2FA Setup
      tags:
        - Auth
  /api/auth/2fa/verify:
    post:
      description: The normal endpoint for a normal login, with 2fa already set up.
      operationId: verify-2fa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFACodeInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 2FA Verification
      tags:
        - Auth
  /api/auth/2fa/verify-recovery:
    post:
      description: Use a one-time recovery code instead of a TOTP code to complete login.
      operationId: verify-2fa-recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFARecoveryCodeInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 2FA Recovery Code Verification
      tags:
        - Auth
  /api/auth/change-password:
    post:
      operationId: change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the current password
      tags:
        - Auth
  /api/auth/forgot-password:
    post:
      operationId: forgot-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSentOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request a password reset mail
      tags:
        - Auth
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Login with existing User
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Logout from current User
      tags:
        - Auth
  /api/auth/new-password:
    post:
      operationId: new-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
